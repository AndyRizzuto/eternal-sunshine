<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <radialGradient id="roomGlow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#4a2e10"/>
      <stop offset="60%" stop-color="#2a1808"/>
      <stop offset="100%" stop-color="#140c04"/>
    </radialGradient>
    <radialGradient id="flame1" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="25%" stop-color="#f5c040"/>
      <stop offset="65%" stop-color="#e07820"/>
      <stop offset="100%" stop-color="#c84010" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame2" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff5c0"/>
      <stop offset="25%" stop-color="#f5c040"/>
      <stop offset="65%" stop-color="#d86820"/>
      <stop offset="100%" stop-color="#b83810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8a030" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e8a030" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowF">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="medGlow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- Dark warm chapel background -->
  <rect width="1200" height="420" fill="url(#roomGlow)"/>

  <!-- Subtle stone wall texture hint via horizontal bands -->
  <rect x="0" y="0" width="1200" height="1" fill="#ffffff" opacity="0.02"/>
  <rect x="0" y="60" width="1200" height="1" fill="#ffffff" opacity="0.015"/>
  <rect x="0" y="120" width="1200" height="1" fill="#ffffff" opacity="0.015"/>
  <rect x="0" y="180" width="1200" height="1" fill="#ffffff" opacity="0.02"/>
  <rect x="0" y="240" width="1200" height="1" fill="#ffffff" opacity="0.015"/>
  <rect x="0" y="300" width="1200" height="1" fill="#ffffff" opacity="0.015"/>
  <rect x="0" y="360" width="1200" height="1" fill="#ffffff" opacity="0.02"/>

  <!-- Shelf/surface at bottom third -->
  <rect x="0" y="320" width="1200" height="100" fill="#1e1008" opacity="0.8"/>
  <rect x="0" y="318" width="1200" height="4" fill="#4a3010" opacity="0.6"/>

  <!-- Candle 1 — far left, short -->
  <rect x="120" y="260" width="28" height="60" rx="2" fill="#e8dcc0" opacity="0.88"/>
  <rect x="122" y="262" width="24" height="56" rx="1" fill="#f0e8d0" opacity="0.4"/>
  <!-- Wick -->
  <line x1="134" y1="260" x2="134" y2="254" stroke="#3a2808" stroke-width="1.5"/>
  <!-- Flame -->
  <ellipse cx="134" cy="246" rx="7" ry="11" fill="url(#flame2)" opacity="0.95" filter="url(#glowF)"/>
  <ellipse cx="134" cy="249" rx="3" ry="5" fill="#fff8d0" opacity="0.9"/>
  <!-- Glow halo -->
  <ellipse cx="134" cy="260" rx="55" ry="45" fill="url(#glow1)" filter="url(#softGlow)"/>

  <!-- Candle 2 -->
  <rect x="220" y="240" width="32" height="80" rx="2" fill="#ebe0c8" opacity="0.9"/>
  <rect x="222" y="242" width="28" height="76" rx="1" fill="#f2ecd8" opacity="0.4"/>
  <line x1="236" y1="240" x2="236" y2="233" stroke="#3a2808" stroke-width="1.5"/>
  <ellipse cx="236" cy="224" rx="8" ry="13" fill="url(#flame1)" opacity="0.95" filter="url(#glowF)"/>
  <ellipse cx="236" cy="228" rx="3.5" ry="6" fill="#fff8d0" opacity="0.9"/>
  <ellipse cx="236" cy="250" rx="65" ry="50" fill="url(#glow1)" filter="url(#softGlow)"/>

  <!-- Candle 3 — center-left -->
  <rect x="350" y="230" width="30" height="90" rx="2" fill="#ede2ca" opacity="0.92"/>
  <rect x="352" y="232" width="26" height="86" rx="1" fill="#f4eeda" opacity="0.4"/>
  <line x1="365" y1="230" x2="365" y2="223" stroke="#3a2808" stroke-width="1.5"/>
  <ellipse cx="365" cy="214" rx="8" ry="13" fill="url(#flame1)" opacity="0.95" filter="url(#glowF)"/>
  <ellipse cx="365" cy="218" rx="3.5" ry="6" fill="#fff8d0" opacity="0.9"/>
  <ellipse cx="365" cy="245" rx="70" ry="55" fill="url(#glow1)" filter="url(#softGlow)"/>

  <!-- Candle 4 — center (tallest, hero candle) -->
  <rect x="560" y="210" width="36" height="110" rx="3" fill="#f0e8d4" opacity="0.95"/>
  <rect x="562" y="212" width="32" height="106" rx="2" fill="#faf5e8" opacity="0.45"/>
  <!-- Wax drip -->
  <ellipse cx="578" cy="215" rx="18" ry="5" fill="#e8dcc0" opacity="0.8"/>
  <line x1="578" y1="210" x2="579" y2="202" stroke="#3a2808" stroke-width="2"/>
  <ellipse cx="579" cy="193" rx="9" ry="15" fill="url(#flame1)" opacity="0.98" filter="url(#glowF)"/>
  <ellipse cx="579" cy="197" rx="4" ry="7" fill="#fffae0" opacity="0.95"/>
  <ellipse cx="579" cy="240" rx="90" ry="70" fill="url(#glow1)" filter="url(#softGlow)"/>

  <!-- Candle 5 — center-right -->
  <rect x="720" y="238" width="30" height="82" rx="2" fill="#ede2ca" opacity="0.9"/>
  <rect x="722" y="240" width="26" height="78" rx="1" fill="#f4eeda" opacity="0.4"/>
  <line x1="735" y1="238" x2="735" y2="231" stroke="#3a2808" stroke-width="1.5"/>
  <ellipse cx="735" cy="222" rx="8" ry="13" fill="url(#flame2)" opacity="0.95" filter="url(#glowF)"/>
  <ellipse cx="735" cy="226" rx="3.5" ry="6" fill="#fff8d0" opacity="0.9"/>
  <ellipse cx="735" cy="252" rx="70" ry="55" fill="url(#glow1)" filter="url(#softGlow)"/>

  <!-- Candle 6 -->
  <rect x="870" y="252" width="28" height="68" rx="2" fill="#ebe0c8" opacity="0.88"/>
  <rect x="872" y="254" width="24" height="64" rx="1" fill="#f2ecd8" opacity="0.4"/>
  <line x1="884" y1="252" x2="884" y2="245" stroke="#3a2808" stroke-width="1.5"/>
  <ellipse cx="884" cy="237" rx="7" ry="11" fill="url(#flame2)" opacity="0.9" filter="url(#glowF)"/>
  <ellipse cx="884" cy="241" rx="3" ry="5" fill="#fff8d0" opacity="0.9"/>
  <ellipse cx="884" cy="264" rx="58" ry="46" fill="url(#glow1)" filter="url(#softGlow)"/>

  <!-- Candle 7 — far right, short -->
  <rect x="1010" y="268" width="26" height="52" rx="2" fill="#e8dcc0" opacity="0.85"/>
  <line x1="1023" y1="268" x2="1023" y2="262" stroke="#3a2808" stroke-width="1.5"/>
  <ellipse cx="1023" cy="254" rx="7" ry="11" fill="url(#flame1)" opacity="0.88" filter="url(#glowF)"/>
  <ellipse cx="1023" cy="258" rx="3" ry="5" fill="#fff8d0" opacity="0.9"/>
  <ellipse cx="1023" cy="276" rx="50" ry="42" fill="url(#glow1)" filter="url(#softGlow)"/>

  <!-- Overall warm glow atmosphere across the scene -->
  <rect width="1200" height="420" fill="#c87820" opacity="0.04"/>
</svg>
