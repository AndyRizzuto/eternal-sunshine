<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8d8e8"/>
      <stop offset="40%" stop-color="#dce8f0"/>
      <stop offset="100%" stop-color="#f0e8d0"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c87a" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#d4a840" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="softer"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- Sky gradient background -->
  <rect width="1200" height="420" fill="url(#sky)"/>
  <!-- Warm horizon glow -->
  <rect width="1200" height="420" fill="url(#horizon)"/>

  <!-- Distant soft cloud banks -->
  <ellipse cx="200" cy="80" rx="280" ry="55" fill="white" opacity="0.45" filter="url(#softer)"/>
  <ellipse cx="700" cy="50" rx="350" ry="45" fill="white" opacity="0.35" filter="url(#softer)"/>
  <ellipse cx="1100" cy="95" rx="240" ry="50" fill="white" opacity="0.4" filter="url(#softer)"/>

  <!-- Mid clouds, lighter -->
  <ellipse cx="350" cy="120" rx="160" ry="28" fill="white" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="900" cy="135" rx="200" ry="32" fill="white" opacity="0.5" filter="url(#soft)"/>

  <!-- Thin horizontal haze lines at horizon -->
  <rect x="0" y="320" width="1200" height="2" fill="#c8a860" opacity="0.2"/>
  <rect x="0" y="340" width="1200" height="2" fill="#c0a050" opacity="0.15"/>

  <!-- Treeline silhouette at very bottom -->
  <rect x="0" y="380" width="1200" height="40" fill="#2a3830" opacity="0.55"/>
  <!-- Individual tree tops -->
  <ellipse cx="60" cy="375" rx="45" ry="22" fill="#2a3830" opacity="0.6"/>
  <ellipse cx="140" cy="370" rx="38" ry="20" fill="#2a3830" opacity="0.55"/>
  <ellipse cx="220" cy="378" rx="50" ry="24" fill="#2a3830" opacity="0.6"/>
  <ellipse cx="310" cy="372" rx="42" ry="20" fill="#2a3830" opacity="0.5"/>
  <ellipse cx="420" cy="376" rx="55" ry="22" fill="#2a3830" opacity="0.58"/>
  <ellipse cx="540" cy="370" rx="48" ry="20" fill="#2a3830" opacity="0.55"/>
  <ellipse cx="650" cy="374" rx="52" ry="22" fill="#2a3830" opacity="0.6"/>
  <ellipse cx="760" cy="371" rx="45" ry="21" fill="#2a3830" opacity="0.55"/>
  <ellipse cx="870" cy="376" rx="50" ry="23" fill="#2a3830" opacity="0.58"/>
  <ellipse cx="970" cy="372" rx="44" ry="20" fill="#2a3830" opacity="0.52"/>
  <ellipse cx="1060" cy="375" rx="48" ry="22" fill="#2a3830" opacity="0.6"/>
  <ellipse cx="1150" cy="370" rx="40" ry="20" fill="#2a3830" opacity="0.55"/>

  <!-- Goose V-formation -->
  <!-- Each goose: a small M/chevron shape representing outstretched wings in flight -->
  <!-- Lead goose, center top -->
  <path d="M580,165 Q590,155 600,165 Q610,155 620,165" fill="none" stroke="#2c3a28" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Body dot -->
  <ellipse cx="600" cy="163" rx="4" ry="3" fill="#2c3a28"/>

  <!-- Second row: 2 geese -->
  <path d="M530,185 Q540,175 550,185 Q560,175 570,185" fill="none" stroke="#2c3a28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="550" cy="183" rx="3.5" ry="2.5" fill="#2c3a28"/>

  <path d="M630,185 Q640,175 650,185 Q660,175 670,185" fill="none" stroke="#2c3a28" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="650" cy="183" rx="3.5" ry="2.5" fill="#2c3a28"/>

  <!-- Third row: 3 geese -->
  <path d="M478,207 Q488,197 498,207 Q508,197 518,207" fill="none" stroke="#2c3a28" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="498" cy="205" rx="3" ry="2.2" fill="#2c3a28"/>

  <path d="M580,210 Q590,200 600,210 Q610,200 620,210" fill="none" stroke="#2c3a28" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="600" cy="208" rx="3" ry="2.2" fill="#2c3a28"/>

  <path d="M680,207 Q690,197 700,207 Q710,197 720,207" fill="none" stroke="#2c3a28" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="700" cy="205" rx="3" ry="2.2" fill="#2c3a28"/>

  <!-- Fourth row: 4 geese -->
  <path d="M424,232 Q433,223 442,232 Q451,223 460,232" fill="none" stroke="#3a4a36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="442" cy="230" rx="2.8" ry="2" fill="#3a4a36"/>

  <path d="M524,235 Q533,226 542,235 Q551,226 560,235" fill="none" stroke="#3a4a36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="542" cy="233" rx="2.8" ry="2" fill="#3a4a36"/>

  <path d="M638,235 Q647,226 656,235 Q665,226 674,235" fill="none" stroke="#3a4a36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="656" cy="233" rx="2.8" ry="2" fill="#3a4a36"/>

  <path d="M738,232 Q747,223 756,232 Q765,223 774,232" fill="none" stroke="#3a4a36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="756" cy="230" rx="2.8" ry="2" fill="#3a4a36"/>

  <!-- Fifth row: stragglers / trailing birds, slightly more spread -->
  <path d="M374,260 Q382,252 390,260 Q398,252 406,260" fill="none" stroke="#4a5a46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M474,265 Q482,257 490,265 Q498,257 506,265" fill="none" stroke="#4a5a46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M692,265 Q700,257 708,265 Q716,257 724,265" fill="none" stroke="#4a5a46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M792,260 Q800,252 808,260 Q816,252 824,260" fill="none" stroke="#4a5a46" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
