<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="stormSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3040"/>
      <stop offset="45%" stop-color="#4a5068"/>
      <stop offset="75%" stop-color="#7a6840"/>
      <stop offset="100%" stop-color="#c8a840"/>
    </linearGradient>
    <linearGradient id="ray1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e090" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f5e090" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ray2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0d870" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f0d870" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ray3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fae8a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fae8a0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cloudBlur"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="lightBlur"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <!-- Dark storm sky background -->
  <rect width="1200" height="420" fill="url(#stormSky)"/>

  <!-- Deep cloud masses top left -->
  <ellipse cx="100" cy="60" rx="280" ry="80" fill="#1e2535" opacity="0.9" filter="url(#cloudBlur)"/>
  <ellipse cx="0" cy="40" rx="200" ry="70" fill="#222838" opacity="0.95"/>
  <ellipse cx="220" cy="80" rx="260" ry="70" fill="#252b3a" opacity="0.85"/>

  <!-- Deep cloud masses top right -->
  <ellipse cx="1100" cy="50" rx="260" ry="75" fill="#1e2535" opacity="0.9" filter="url(#cloudBlur)"/>
  <ellipse cx="1200" cy="30" rx="180" ry="65" fill="#222838" opacity="0.95"/>
  <ellipse cx="980" cy="70" rx="240" ry="68" fill="#252b3a" opacity="0.85"/>

  <!-- Central break in clouds — source of light -->
  <ellipse cx="600" cy="30" rx="120" ry="45" fill="#f5e890" opacity="0.6" filter="url(#lightBlur)"/>
  <ellipse cx="600" cy="20" rx="80" ry="35" fill="#fff8d0" opacity="0.7" filter="url(#lightBlur)"/>

  <!-- Crepuscular rays — polygons fanning down from center gap -->
  <!-- Center ray -->
  <polygon points="580,0 620,0 680,420 520,420" fill="url(#ray1)" opacity="0.38"/>
  <!-- Left of center ray -->
  <polygon points="545,0 575,0 520,420 400,420" fill="url(#ray2)" opacity="0.28"/>
  <!-- Right of center ray -->
  <polygon points="625,0 655,0 800,420 680,420" fill="url(#ray2)" opacity="0.28"/>
  <!-- Outer left ray -->
  <polygon points="500,0 530,0 360,420 260,420" fill="url(#ray3)" opacity="0.18"/>
  <!-- Outer right ray -->
  <polygon points="670,0 700,0 940,420 840,420" fill="url(#ray3)" opacity="0.18"/>
  <!-- Subtle far rays -->
  <polygon points="460,0 490,0 220,420 140,420" fill="url(#ray3)" opacity="0.1"/>
  <polygon points="710,0 740,0 1060,420 980,420" fill="url(#ray3)" opacity="0.1"/>

  <!-- Warm glow pool at base of central rays -->
  <ellipse cx="600" cy="420" rx="320" ry="80" fill="#d4a830" opacity="0.25" filter="url(#lightBlur)"/>
  <ellipse cx="600" cy="400" rx="180" ry="50" fill="#e8c040" opacity="0.18" filter="url(#lightBlur)"/>

  <!-- Mid-storm cloud layers -->
  <ellipse cx="150" cy="140" rx="220" ry="55" fill="#30384a" opacity="0.75" filter="url(#cloudBlur)"/>
  <ellipse cx="1050" cy="155" rx="200" ry="52" fill="#30384a" opacity="0.7" filter="url(#cloudBlur)"/>

  <!-- Lower cloud edges with warm lit undersides -->
  <ellipse cx="300" cy="230" rx="280" ry="50" fill="#4a4030" opacity="0.55" filter="url(#cloudBlur)"/>
  <ellipse cx="900" cy="245" rx="300" ry="52" fill="#4a4030" opacity="0.5" filter="url(#cloudBlur)"/>

  <!-- Bright central break highlight -->
  <ellipse cx="600" cy="45" rx="60" ry="28" fill="#fff8e0" opacity="0.55" filter="url(#glow)"/>
</svg>
