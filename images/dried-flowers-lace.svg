  <path d="M310,420 Q318,310 308,200 Q300,130 316,40" fill="none" stroke="#7a5e28" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M380,420 Q390,330 378,220 Q370,150 385,50" fill="none" stroke="#8a6a30" stroke-width="3" stroke-linecap="round"/>
