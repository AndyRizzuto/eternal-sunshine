  <ellipse cx="380" cy="46" rx="7" ry="10" fill="#9a7858" opacity="0.85"/>
  <ellipse cx="374" cy="38" rx="6" ry="9" fill="#8a6850" opacity="0.8"/>
  <ellipse cx="388" cy="40" rx="6" ry="9" fill="#9a7858" opacity="0.75"/>
  <ellipse cx="382" cy="30" rx="5.5" ry="8" fill="#8a6850" opacity="0.8"/>

