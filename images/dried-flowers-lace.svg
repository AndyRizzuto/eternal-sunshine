  <path d="M660,420 Q665,340 657,250 Q650,175 664,65" fill="none" stroke="#7a5e28" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M750,420 Q758,330 748,220 Q740,148 756,52" fill="none" stroke="#8a6a30" stroke-width="3" stroke-linecap="round"/>
