  <ellipse cx="662" cy="60" rx="13" ry="12" fill="#9a7850" opacity="0.87"/>
  <ellipse cx="662" cy="60" rx="8" ry="7" fill="#886040" opacity="0.72"/>
  <ellipse cx="662" cy="57" rx="4.5" ry="3.5" fill="#724e32" opacity="0.6"/>

