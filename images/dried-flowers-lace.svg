  <ellipse cx="750" cy="48" rx="8" ry="11" fill="#9a7858" opacity="0.85"/>
  <ellipse cx="744" cy="40" rx="6.5" ry="9" fill="#887058" opacity="0.8"/>
  <ellipse cx="758" cy="42" rx="6.5" ry="9" fill="#9a7858" opacity="0.78"/>
  <ellipse cx="752" cy="32" rx="5.5" ry="8" fill="#887058" opacity="0.82"/>

  <!-- Flower 8 -->
  <ellipse cx="840" cy="54" rx="14" ry="12" fill="#a87840" opacity="0.88"/>
  <ellipse cx="840" cy="54" rx="9" ry="8" fill="#946038" opacity="0.72"/>
  <ellipse cx="840" cy="51" rx="5" ry="4" fill="#7e5030" opacity="0.62"/>

  <!-- Flower 9 -->
  <ellipse cx="922" cy="38" rx="12" ry="11" fill="#988050" opacity="0.85"/>
  <ellipse cx="922" cy="38" rx="8" ry="7" fill="#866840" opacity="0.7"/>

  <!-- Scattered dried petals on lace surface -->
  <ellipse cx="160" cy="380" rx="9" ry="5" fill="#9a6840" opacity="0.5" transform="rotate(-20 160 380)"/>
  <ellipse cx="450" cy="370" rx="8" ry="4" fill="#a07040" opacity="0.45" transform="rotate(15 450 370)"/>
  <ellipse cx="700" cy="390" rx="10" ry="5" fill="#8a5e38" opacity="0.5" transform="rotate(-10 700 390)"/>
  <ellipse cx="990" cy="375" rx="8" ry="4" fill="#9a7048" opacity="0.45" transform="rotate(25 990 375)"/>
  <ellipse cx="1100" cy="360" rx="9" ry="5" fill="#907040" opacity="0.4" transform="rotate(-30 1100 360)"/>
</svg>
