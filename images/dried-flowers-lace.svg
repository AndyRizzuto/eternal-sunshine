<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f0e8d4"/>
      <stop offset="100%" stop-color="#e4d8c0"/>
    </linearGradient>
    <pattern id="lace" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <!-- Lace grid point -->
      <circle cx="30" cy="30" r="2.5" fill="none" stroke="#c8b890" stroke-width="0.7" opacity="0.5"/>
      <!-- Diamond mesh lines -->
      <line x1="30" y1="0" x2="0" y2="30" stroke="#c8b890" stroke-width="0.5" opacity="0.35"/>
      <line x1="30" y1="0" x2="60" y2="30" stroke="#c8b890" stroke-width="0.5" opacity="0.35"/>
      <line x1="0" y1="30" x2="30" y2="60" stroke="#c8b890" stroke-width="0.5" opacity="0.35"/>
      <line x1="60" y1="30" x2="30" y2="60" stroke="#c8b890" stroke-width="0.5" opacity="0.35"/>
      <!-- Corner flower petals -->
      <circle cx="0" cy="0" r="4" fill="none" stroke="#c8b890" stroke-width="0.6" opacity="0.3"/>
      <circle cx="60" cy="0" r="4" fill="none" stroke="#c8b890" stroke-width="0.6" opacity="0.3"/>
      <circle cx="0" cy="60" r="4" fill="none" stroke="#c8b890" stroke-width="0.6" opacity="0.3"/>
      <circle cx="60" cy="60" r="4" fill="none" stroke="#c8b890" stroke-width="0.6" opacity="0.3"/>
    </pattern>
    <filter id="softShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#7a6040" flood-opacity="0.3"/>
    </filter>
    <filter id="blur1"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>

  <!-- Aged parchment background -->
  <rect width="1200" height="420" fill="url(#bg)"/>

