  <ellipse cx="498" cy="76" rx="14" ry="13" fill="#b08848" opacity="0.88"/>
  <ellipse cx="498" cy="76" rx="9" ry="8" fill="#9a6e38" opacity="0.75"/>
  <ellipse cx="498" cy="73" rx="5" ry="4" fill="#845a2e" opacity="0.65"/>

  <!-- Flower 5: central large dried rose -->
  <ellipse cx="580" cy="64" rx="16" ry="14" fill="#a07040" opacity="0.9"/>
  <ellipse cx="580" cy="64" rx="11" ry="10" fill="#8c5c32" opacity="0.75"/>
  <ellipse cx="580" cy="61" rx="6" ry="5" fill="#784e2c" opacity="0.65"/>
