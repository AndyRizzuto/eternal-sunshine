  <ellipse cx="200" cy="350" rx="280" ry="120" fill="#c8a860" opacity="0.07"/>
  <ellipse cx="1000" cy="80" rx="250" ry="100" fill="#b89850" opacity="0.06"/>
  <ellipse cx="600" cy="210" rx="350" ry="160" fill="#d4b870" opacity="0.05"/>

  <!-- Lace textile layer -->
  <rect width="1200" height="420" fill="url(#lace)"/>

  <!-- Lace border scallop edges (top and bottom) -->
  <!-- Top scallop -->
  <path d="M0,0 Q30,25 60,0 Q90,25 120,0 Q150,25 180,0 Q210,25 240,0 Q270,25 300,0 Q330,25 360,0 Q390,25 420,0 Q450,25 480,0 Q510,25 540,0 Q570,25 600,0 Q630,25 660,0 Q690,25 720,0 Q750,25 780,0 Q810,25 840,0 Q870,25 900,0 Q930,25 960,0 Q990,25 1020,0 Q1050,25 1080,0 Q1110,25 1140,0 Q1170,25 1200,0 L1200,20 L0,20 Z" fill="#e8dcc8" opacity="0.7"/>
  <!-- Bottom scallop -->
  <path d="M0,420 Q30,395 60,420 Q90,395 120,420 Q150,395 180,420 Q210,395 240,420 Q270,395 300,420 Q330,395 360,420 Q390,395 420,420 Q450,395 480,420 Q510,395 540,420 Q570,395 600,420 Q630,395 660,420 Q690,395 720,420 Q750,395 780,420 Q810,395 840,420 Q870,395 900,420 Q930,395 960,420 Q990,395 1020,420 Q1050,395 1080,420 Q1110,395 1140,420 Q1170,395 1200,420 L1200,400 L0,400 Z" fill="#e8dcc8" opacity="0.7"/>

