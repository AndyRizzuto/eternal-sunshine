  <path d="M308,200 Q330,185 322,162" fill="none" stroke="#7a6030" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M378,220 Q355,202 362,180" fill="none" stroke="#7a6030" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M496,250 Q520,235 514,212" fill="none" stroke="#7a6030" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M578,260 Q558,240 564,218" fill="none" stroke="#7a6030" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M657,250 Q678,232 672,210" fill="none" stroke="#7a6030" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M748,220 Q725,202 732,180" fill="none" stroke="#7a6030" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M837,240 Q858,220 852,198" fill="none" stroke="#7a6030" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Dried flower heads — small round dried roses/lavender types -->
  <!-- Flower 1: small dried rose at top of stem 1 -->
  <ellipse cx="258" cy="55" rx="14" ry="12" fill="#a06840" opacity="0.9"/>
  <ellipse cx="258" cy="55" rx="9" ry="8" fill="#8a5230" opacity="0.7"/>
  <ellipse cx="258" cy="52" rx="5" ry="4" fill="#7a4428" opacity="0.6"/>

  <!-- Flower 2 -->
  <ellipse cx="314" cy="38" rx="13" ry="11" fill="#9a7848" opacity="0.88"/>
  <ellipse cx="314" cy="38" rx="8" ry="7" fill="#885a38" opacity="0.7"/>
  <ellipse cx="314" cy="36" rx="4.5" ry="3.5" fill="#724a2e" opacity="0.65"/>

